# Automatically release a new version when a PR is merged to branch `release`

name: 'release'

on:
  pull_request:
    types: [ closed ]
    branches: [ release ]

concurrency:
  group: ${{ github.event.pull_request.merged && 'release-publication' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH_TO_RELEASE: 'release'
  TAG_PREFIX: 'v'
  FILE_CHANGELOG: 'RELEASE-NOTES.md'
  DOCKER_IMAGE: btnguyen2k/finhub # update your Docker Hub image name here

jobs:
  CaptureContext:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      TARGET_SHA: ${{ steps.context.outputs.target-sha }}
    steps:
      - name: Capture workflow context
        id: context
        uses: btnguyen2k/gh-actions/workflow-context@402d4293c057c8931fbb804c3cc18a5d0047fb95 # workflow-context/v0.1.0
        with:
          target-sha: ${{ github.event.pull_request.merge_commit_sha }}

  CallCI:
    needs: [ CaptureContext ]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yaml
    with:
      target-sha: ${{ needs.CaptureContext.outputs.TARGET_SHA }}
    secrets: inherit

  PrepareRelease:
    runs-on: ubuntu-latest
    needs: [ CaptureContext, CallCI ]
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.CaptureContext.outputs.TARGET_SHA }}
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
      TARGET_SHA: ${{ steps.metadata.outputs.target-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Release (dry-run)
        # see https://github.com/btnguyen2k/action-semrelease for documentation
        id: release_dry_run
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          dry-run: true
          github-token: ${{ github.token }}
          target-sha: ${{ needs.CaptureContext.outputs.TARGET_SHA }}
          branches: ${{ env.BRANCH_TO_RELEASE }}
          tag-prefix: ${{ env.TAG_PREFIX }}
      - name: Update module meta
        if: steps.release_dry_run.outputs.result == 'SUCCESS'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
          RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
        with:
          script: |
            const fs = require('node:fs');
            const { VERSION, RELEASE_NOTES, TAG_PREFIX, FILE_CHANGELOG } = process.env;
            const tag = `${TAG_PREFIX}${VERSION}`;
            const changelog = fs.readFileSync(FILE_CHANGELOG, 'utf8');
            if (changelog.split(/\r?\n/).some(line => line.startsWith('## ') && line.endsWith(` - ${tag}`))) {
              throw new Error(`Changelog already contains ${tag}; inspect the previous release preparation.`);
            }
            const headingEnd = changelog.indexOf('\n');
            if (headingEnd < 0) {
              throw new Error('Changelog must contain a heading followed by a newline.');
            }
            const date = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(
              FILE_CHANGELOG,
              `${changelog.slice(0, headingEnd + 1)}\n## ${date} - ${tag}\n\n${RELEASE_NOTES.trimEnd()}\n${changelog.slice(headingEnd + 1)}`,
            );
            for (const file of fs.readdirSync('.').filter(file => file.endsWith('.md') && file !== FILE_CHANGELOG)) {
              const original = fs.readFileSync(file, 'utf8');
              let updated = original.replaceAll('<<VERSION>>', tag);
              if (file === 'README.md') {
                const marker = /^\*\*Version:\*\*.*$/m;
                const versionLine = `**Version:** ${tag}`;
                if (marker.test(updated)) {
                  updated = updated.replace(marker, versionLine);
                } else {
                  const boundary = updated.search(/\r?\n\r?\n/);
                  updated = boundary < 0
                    ? `${versionLine}\n\n${updated}`
                    : `${updated.slice(0, boundary)}\n\n${versionLine}${updated.slice(boundary)}`;
                }
              }
              if (updated !== original) fs.writeFileSync(file, updated);
            }
            const versionFile = 'app/version.py';
            const versionSource = fs.readFileSync(versionFile, 'utf8');
            const versionPattern = /^VERSION\s*=.*$/m;
            if (!versionPattern.test(versionSource)) {
              throw new Error(`No VERSION assignment found in ${versionFile}.`);
            }
            fs.writeFileSync(versionFile, versionSource.replace(versionPattern, `VERSION = ${JSON.stringify(VERSION)}`));
      - name: Commit release metadata and capture C
        if: steps.release_dry_run.outputs.result == 'SUCCESS'
        id: metadata
        env:
          VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/${BRANCH_TO_RELEASE}" | cut -f1)
          if [[ "$REMOTE_SHA" != "$SOURCE_SHA" || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Release branch changed; refusing to publish an unverified source."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ./*.md app/version.py
          git commit -m "chore(release): prepare ${TAG_PREFIX}${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH_TO_RELEASE}"
          printf 'target-sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  Release:
    runs-on: ubuntu-latest
    needs: [ PrepareRelease ]
    if: needs.PrepareRelease.outputs.RESULT == 'SUCCESS'
    permissions:
      contents: write
    outputs:
      RESULT: ${{ steps.release.outputs.result }}
      VERSION: ${{ steps.release.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release.outputs.releaseNotes }}
      TARGET_SHA: ${{ needs.PrepareRelease.outputs.TARGET_SHA }}
    steps:
      - name: Publish release at C
        id: release
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          dry-run: false
          github-token: ${{ github.token }}
          target-sha: ${{ needs.PrepareRelease.outputs.TARGET_SHA }}
          version: ${{ needs.PrepareRelease.outputs.VERSION }}
          branches: ${{ env.BRANCH_TO_RELEASE }}
          tag-prefix: ${{ env.TAG_PREFIX }}

  MergeToMain:
    runs-on: ubuntu-latest
    needs: [ Release ]
    if: needs.Release.outputs.RESULT == 'SUCCESS'
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_SHA: ${{ needs.Release.outputs.TARGET_SHA }}
      VERSION: ${{ needs.Release.outputs.VERSION }}
      RELEASE_NOTES: ${{ needs.Release.outputs.RELEASE_NOTES }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Cleanup release metadata after publication
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/${BRANCH_TO_RELEASE}" | cut -f1)
          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then
            echo "::error::Release branch changed; refusing to discard pending release messages."
            exit 1
          fi
          if [[ -f .semrelease/this_release ]]; then
            printf '# This file has been cleaned up post-releasing version %s.\n' "$VERSION" > .semrelease/this_release
            printf '%s\n' '# Generate its content quickly using the following command:' \
              '#   git log origin..HEAD | grep "^\s" > .semrelease/this_release' >> .semrelease/this_release
            git add -- .semrelease/this_release
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(release): clear metadata after ${TAG_PREFIX}${VERSION}"
              git push origin "HEAD:refs/heads/${BRANCH_TO_RELEASE}"
            fi
          fi
      - name: Create or update release-to-main PR
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_TO_RELEASE;
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: 'main',
            });
            const details = {
              owner, repo,
              title: `Merge to main after releasing new version ${process.env.VERSION}`,
              body: process.env.RELEASE_NOTES,
            };
            const { data: pr } = existing.length
              ? await github.rest.pulls.update({ ...details, pull_number: existing[0].number })
              : await github.rest.pulls.create({
                  ...details, head: branch, base: 'main', maintainer_can_modify: true,
                });
            core.info(`Release-to-main PR: ${pr.html_url}`);

  PublishDockerImagesLinuxBuild:
    if: |
      needs.Release.outputs.RESULT == 'SUCCESS'
    needs: [Release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platforms: [ 'linux/amd64', 'linux/arm64' ] # change target platform list if needed
    name: Build Docker image(s) - Linux - Release Branch
    env:
      VERSION: ${{ needs.Release.outputs.VERSION }}
      TARGET_SHA: ${{ needs.Release.outputs.TARGET_SHA }}
    outputs:
      VERSION: ${{ needs.Release.outputs.VERSION }}
      TARGET_SHA: ${{ needs.Release.outputs.TARGET_SHA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Prepare
        run: |
          platform=${{ matrix.platforms }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ env.TARGET_SHA }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          file: ./Dockerfile
          context: ./
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  PublishDockerImagesLinuxMerge:
    runs-on: ubuntu-latest
    needs: PublishDockerImagesLinuxBuild
    name: Merge & Publish Docker image(s) - Linux
    env:
      VERSION: ${{ needs.PublishDockerImagesLinuxBuild.outputs.VERSION }}
      TARGET_SHA: ${{ needs.PublishDockerImagesLinuxBuild.outputs.TARGET_SHA }}
    outputs:
      VERSION: ${{ needs.PublishDockerImagesLinuxBuild.outputs.VERSION }}
      TARGET_SHA: ${{ needs.PublishDockerImagesLinuxBuild.outputs.TARGET_SHA }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_IMAGE }}:release \
            -t ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} \
            -t ${{ env.DOCKER_IMAGE }}:${{ env.TARGET_SHA }} \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

  DeployToProd:
    runs-on: ubuntu-latest
    needs: [ PublishDockerImagesLinuxMerge ]
    name: Deploy to production
    env:
      VERSION: ${{ needs.PublishDockerImagesLinuxMerge.outputs.VERSION }}
      TARGET_SHA: ${{ needs.PublishDockerImagesLinuxMerge.outputs.TARGET_SHA }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.IMAGE_TO_DEPLOY }}:${{ env.TARGET_SHA }}
      - name: Deploy (Lite)
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_LITE }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP_LITE }}
          imageToDeploy: ${{ secrets.IMAGE_TO_DEPLOY }}:${{ env.TARGET_SHA }}
