name: 'ci'

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '.github/dependabot.yaml'
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ '**' ]
  workflow_call:
    inputs:
      target-sha:
        description: 'Commit SHA to check out and analyze.'
        required: false
        type: string

  # Allow manually trigger
  workflow_dispatch:

env:
  TAG_PREFIX: v
  DOCKER_IMAGE: btnguyen2k/finhub # update your Docker Hub image name here

jobs:
  BuildAndTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ '3.12', '3.13', '3.14' ] # change target Python versions if needed
    name: Build and Test with Python ${{ matrix.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint code
        run: |
          ruff check .
          ruff format --check --diff .
      - name: Run tests
        run: |
          # Run unit tests
          pytest

  BuildAndTestDotNetContracts:
    name: Build and Test .NET 8 Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'
      - name: Restore .NET projects
        run: dotnet restore clients/dotnet/FinHub.Client.Contracts.Tests/FinHub.Client.Contracts.Tests.csproj --nologo
      - name: Build .NET projects
        run: dotnet build clients/dotnet/FinHub.Client.Contracts.Tests/FinHub.Client.Contracts.Tests.csproj --configuration Release --no-restore --nologo --warnaserror
      - name: Run .NET contract tests
        run: dotnet test clients/dotnet/FinHub.Client.Contracts.Tests/FinHub.Client.Contracts.Tests.csproj --configuration Release --no-build --no-restore --nologo

  BuildDockerAndQuickTest:
    needs: [ BuildAndTest ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platforms: [ 'linux/amd64' ] # change target platform list if needed
        dockerfiles: [ 'Dockerfile' ] # add more Dockerfiles here if needed
    name: Build and Test Docker image(s) for ${{ matrix.platforms }} with ${{ matrix.dockerfiles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Build Docker image for ${{ matrix.platforms }} with ${{ matrix.dockerfiles }}
        id: docker_build
        uses: btnguyen2k/gh-actions/dockerbp@dockerbp/v0.1.0
        with:
          target-sha: ${{ inputs.target-sha || github.sha }}
          image: btnguyen2k/finhub
          tags: ci
          platforms: linux/amd64
          dockerfile: ./${{ matrix.dockerfiles }}
          context: ./
          mode: build
          publish: false
      - name: Verify Docker build for ${{ matrix.platforms }} with ${{ matrix.dockerfiles }}
        shell: bash
        run: |
          # check if output 'status' from step docker_build is 'built'
          if [[ "${{ steps.docker_build.outputs.status }}" != "built" ]]; then
              echo "❌ Docker build failed for ${{ matrix.platforms }} with ${{ matrix.dockerfiles }}"
              exit 1
          fi
      - name: Test Docker container for ${{ matrix.platforms }} with ${{ matrix.dockerfiles }}
        shell: bash
        env:
          STARTUP_TIMEOUT_SECONDS: '60'
        run: |
          set -euo pipefail

          CONTAINER=$(docker run -d \
            --name test \
            -p 1234:8000 \
            --platform ${{ matrix.platforms }} \
            btnguyen2k/finhub:ci)
          HEALTH_RESPONSE=$(mktemp)
          trap '
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null || true
            rm -f "$HEALTH_RESPONSE"
          ' EXIT
          echo "ℹ️ Started Docker container with ID: ${CONTAINER}"
          DEADLINE=$((SECONDS + STARTUP_TIMEOUT_SECONDS))
          STATUS_CODE=000
          while (( SECONDS < DEADLINE )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" != "true" ]]; then
              echo "❌ Container exited before becoming healthy."
              exit 1
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi
            REQUEST_TIMEOUT=$((REMAINING < 2 ? REMAINING : 2))
            STATUS_CODE=$(curl --silent \
              --connect-timeout 1 \
              --max-time "$REQUEST_TIMEOUT" \
              --output "$HEALTH_RESPONSE" \
              --write-out "%{http_code}" \
              http://localhost:1234/health) || STATUS_CODE=000
            if [[ "$STATUS_CODE" == "200" ]]; then
              echo "✅ Health check output: $(cat "$HEALTH_RESPONSE")"
              exit 0
            fi
            if (( SECONDS < DEADLINE )); then
              sleep 1
            fi
          done
          echo "❌ Health check did not return HTTP 200 within ${STARTUP_TIMEOUT_SECONDS}s (last status: ${STATUS_CODE})."
          echo "❌ Last health check output: $(cat "$HEALTH_RESPONSE")"
          exit 1

  DispatchCacheAutomerge:
    name: Dispatch cache static data auto-merge
    if: |
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'cache-static-data-')
    needs: [BuildAndTest, BuildAndTestDotNetContracts, BuildDockerAndQuickTest]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch auto-merge workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "automerge-cache_static_data.yaml",
              ref: "main",
              inputs: {
                branch: context.ref.replace("refs/heads/", ""),
                validated_sha: context.sha,
              },
            });
            console.log(`✅ Dispatched auto-merge for ${context.ref} at ${context.sha}.`);

  ReleaseDryRun:
    if: github.event_name == 'push'
    needs: [BuildAndTest, BuildAndTestDotNetContracts, BuildDockerAndQuickTest]
    runs-on: ubuntu-latest
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Release (dry-run)
        # see https://github.com/btnguyen2k/action-semrelease for documentation
        id: release_dry_run
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          dry-run: true
          github-token: ${{ github.token }}
          branches: ${{ github.ref_name }}
          tag-prefix: ${{ env.TAG_PREFIX }}

