# Automatically merge PRs created by Cache Static Data after CI passes.

name: "automerge-cache-static-data"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cache static data branch whose PR should be merged
        required: true
        type: string
      validated_sha:
        description: Exact commit SHA validated by CI
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  Automerge:
    runs-on: ubuntu-latest
    if: startsWith(inputs.branch, 'cache-static-data-')
    steps:
      - name: Merge cache static data PR
        uses: actions/github-script@v9
        env:
          CACHE_BRANCH: ${{ inputs.branch }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.CACHE_BRANCH;
            const validatedSha = process.env.VALIDATED_SHA;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: "main",
              head: `${owner}:${branch}`,
            });

            for (const candidate of pulls) {
              const pullNumber = candidate.number;
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });

              const isCachePull =
                pull.state === "open" &&
                !pull.draft &&
                pull.user.login === "github-actions[bot]" &&
                pull.title === "Cache Static Data" &&
                pull.base.ref === "main" &&
                pull.head.ref === branch &&
                pull.head.sha === validatedSha &&
                pull.head.repo?.full_name === `${owner}/${repo}`;

              if (!isCachePull) {
                continue;
              }

              const { data: result } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullNumber,
                merge_method: "merge",
                sha: validatedSha,
              });

              if (!result.merged) {
                core.setFailed(`PR #${pullNumber} was not merged: ${result.message}`);
                return;
              }

              console.log(`Merged cache static data PR #${pullNumber}.`);
              return;
            }

            core.setFailed(`No open cache static data PR found for branch ${branch}.`);
