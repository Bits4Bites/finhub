name: "Cache Static Data"

on:
  schedule:
    # run every Saturday at 00:00 UTC
    - cron: '0 0 * * 6'

  # Allow manually trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  CacheStaticData:
    name: Cache Static Data
    runs-on: ubuntu-latest
    steps:
      - name: Setup env
        run: echo "WORK_BRANCH=cache-static-data-$(date +'%Y%m%d%H')" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create new branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email ""
          git checkout -b ${WORK_BRANCH}
      - name: Sync code to the latest version
        run: |
          git pull origin main
          echo "REFRESH_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update ASX Indices
        run: |
          python -m qnd.qnd_update_asx_indices
          git add .
          if git diff --cached --quiet; then
            echo "ℹ️ No ASX indices changes to commit."
          else
            git commit -am "Update ASX indices"
            echo "✅ ASX indices updated and committed."
          fi
      - name: Update US Indices
        run: |
          python -m qnd.qnd_update_us_indices
          git add .
          if git diff --cached --quiet; then
            echo "ℹ️ No US indices changes to commit."
          else
            git commit -am "Update US indices"
            echo "✅ US indices updated and committed."
          fi
      - name: Update VN Indices
        run: |
          python -m qnd.qnd_update_vn_indices
          git add .
          if git diff --cached --quiet; then
            echo "ℹ️ No VN indices changes to commit."
          else
            git commit -am "Update VN indices"
            echo "✅ VN indices updated and committed."
          fi
#      - name: Cache ASX
#        run: |
#          python -m qnd.qnd_cache_asx
#          git add .
#          git commit -am "Cache ASX data"
#          echo "✅ ASX data cached and committed."
#      - name: Cache SP1500
#        run: |
#          python -m qnd.qnd_cache_sp1500
#          git add .
#          git commit -am "Cache SP1500 data"
#          echo "✅ SP1500 data cached and committed."
      - name: Push changes
        run: |
          if [[ "$(git rev-parse HEAD)" == "$REFRESH_BASE_SHA" ]]; then
            echo "❌ Nothing to push: no index updates were committed."
            exit 1
          fi
          git push origin "${WORK_BRANCH}"
          echo "✅ Branch ${WORK_BRANCH} pushed to origin"
      - name: Create Pull Request
        uses: actions/github-script@v9
        with:
          script: |
            const {data: pr} = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Cache Static Data",
              body: "Update static data for ASX, SP1500, and ASX/US/VN indices.",
              head: "${{ env.WORK_BRANCH }}",
              base: "main",
              maintainer_can_modify: true,
            });
            console.log("✅ Created PR: ", pr);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yaml",
              ref: "${{ env.WORK_BRANCH }}",
            });
            console.log("✅ Dispatched CI for branch: ${{ env.WORK_BRANCH }}");
